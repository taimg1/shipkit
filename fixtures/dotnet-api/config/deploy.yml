# Kamal owns delivery; the kit passes --version and never edits this file (ADR 0001).
#
# This configuration targets dev-server, the simulated host. A real deployment differs in
# three places, all marked below: the server address, the registry, and TLS.
service: shipkit-fixture

image: shipkit-fixture

servers:
  web:
    - host.docker.internal   # REAL: the server's hostname or IP

ssh:
  user: deploy
  port: 2222               # REAL: 22

proxy:
  # REAL: set `ssl: true` and a public `host:` — kamal-proxy then obtains a Let's Encrypt
  # certificate. ACME needs a name that resolves publicly, which is why it cannot be
  # exercised here.
  ssl: false
  app_port: 8080
  healthcheck:
    path: /health
    interval: 3
    timeout: 30

registry:
  server: registry:5000  # REAL: ghcr.io
  username: shipkit
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: arm64

env:
  # A connection string holds a password, so it is a secret: never under `clear`, which is
  # committed here and shown by `docker inspect`. Its value comes from .kamal/secrets.
  #
  # The application connects as `app`, a role that can read and write rows and nothing else.
  # Schema changes are the migration bundle's job, run by the pipeline as the owner (ADR 0005);
  # an application that could run DDL would not need the pipeline to do it.
  secret:
    - ConnectionStrings__Default

accessories:
  db:
    image: postgres:17-alpine
    host: host.docker.internal
    env:
      clear:
        POSTGRES_USER: postgres
        POSTGRES_DB: app
      secret:
        - POSTGRES_PASSWORD
        - APP_DB_PASSWORD
    files:
      # Creates the `app` role the first time the data directory is initialised. On a server
      # whose database already exists it does not run — see the fixture README.
      - config/postgres/create-app-role.sh:/docker-entrypoint-initdb.d/10-create-app-role.sh
    directories:
      # A named volume. Never an ephemeral filesystem — losing this is losing the database.
      - data:/var/lib/postgresql/data
