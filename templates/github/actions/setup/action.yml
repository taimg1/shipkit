# What every job in the client workflow needs before it can call the pipeline.
#
# Copy to .github/actions/setup/action.yml in the client repository, beside the workflow that
# uses it. The workflow runs one job per stage, so without this file the Dagger version, its
# checksum and the way the kit is unpacked would be written out once per job — and a version
# that drifted in one of them would run the same commit on two different engines.
#
# Setup only: nothing here decides what runs, what publishes, or whether a gate passed.
name: shipkit setup
description: Node, Dagger and the pinned kit, for a repository with no copy of the kit in it.

inputs:
  node-version:
    description: Node for the `shipkit` wrapper itself. The pipeline runs in containers, not here.
    required: false
    default: "22"

  dagger-version:
    description: The Dagger version the kit's module is built against.
    required: false
    default: v0.21.9

  dagger-sha256:
    description: >-
      sha256 of dagger_<version>_linux_amd64.tar.gz, from that release's checksums.txt.
      Changes together with dagger-version, never on its own.
    required: false
    default: 33eea0b08d6be444bada18e64b2216459100d6070abcb4b5345cee40c9fff982

  install-dagger:
    description: >-
      "false" for a job that calls no stage. `shipkit summary` reads report files and writes
      markdown (ADR 0009) — it reaches no engine, and the one job that has to run even when
      everything else went wrong should not depend on a download it never uses.
    required: false
    default: "true"

  qemu:
    description: >-
      "true" when `targetArch` in shipkit.yaml is not the runner's (linux-x64) — an ARM server,
      say. The image is then built for the architecture it will run on, and without binfmt
      handlers the emulated build fails with errors that say nothing about architecture. Only
      the job that builds the image needs it.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}

    - if: inputs.qemu == 'true'
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

    # The release archive, checked against a checksum written here, then installed. Not
    # `install.sh | sh`: that runs whatever the download host served, and the checksum that
    # script checks comes from the same host, so it proves the download was not truncated and
    # nothing else. The sum below is from checksums.txt of the release.
    - name: Install Dagger
      if: inputs.install-dagger == 'true'
      shell: bash
      env:
        DAGGER_VERSION: ${{ inputs.dagger-version }}
        DAGGER_SHA256: ${{ inputs.dagger-sha256 }}
      run: |
        set -euo pipefail
        test "$(uname -sm)" = "Linux x86_64" || { echo "the pinned Dagger checksum is for linux/amd64, this runner is $(uname -sm)"; exit 1; }
        archive="dagger_${DAGGER_VERSION}_linux_amd64.tar.gz"
        curl -fsSL -o "$RUNNER_TEMP/$archive" "https://dl.dagger.io/dagger/releases/${DAGGER_VERSION#v}/$archive"
        echo "$DAGGER_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" dagger
        install -m 0755 "$RUNNER_TEMP/dagger" /usr/local/bin/dagger
        dagger version

    # The kit is not checked into this repository: each job fetches it at the commit the `kit:`
    # line of shipkit.yaml names. Forty hex characters or nothing — a tag or a branch can be
    # moved to other code by whoever controls the kit, and this line decides what runs your
    # pipeline. The wrapper itself needs no install: it imports Node builtins only.
    - name: Fetch shipkit
      shell: bash
      run: |
        set -euo pipefail
        KIT_SHA=$(sed -n 's#^kit: github.com/taimg1/shipkit@\([0-9a-f]\{40\}\)$#\1#p' shipkit.yaml)
        test -n "$KIT_SHA" || { echo "shipkit.yaml: no pinned kit: line (kit: github.com/taimg1/shipkit@<40-char commit>)"; exit 2; }
        curl -fsSL "https://codeload.github.com/taimg1/shipkit/tar.gz/$KIT_SHA" | tar xz -C "$RUNNER_TEMP"
        echo "SHIPKIT=$RUNNER_TEMP/shipkit-$KIT_SHA/bin/shipkit" >> "$GITHUB_ENV"
