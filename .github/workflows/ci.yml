# The kit's own CI: run the pipeline against every fixture on every push.
#
# ADR 0001 says this file is a checkout and one call. It is still true per job: every job below
# is a checkout and one `shipkit ci --stage=...`. What changed is how many jobs there are.
#
# One job used to run the whole pipeline, and the run page showed a single box that was either
# green or red. Which stage failed, how long each took, and what a gate actually said all lived
# in a log you had to open and scroll. One job per stage puts that on the graph, where it can be
# read without opening anything.
#
# The cost is real and worth stating: each job is a fresh runner with a cold Dagger cache, so
# the total machine time goes up. The checks run in parallel — per stage, and per fixture since
# the kit gained a second stack — which buys most of the wall clock back.
#
# `build` and `push` share the built container in memory, so they stay in one job. That is what
# `--stage=build,push` exists for.
name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

# A newer push makes an in-flight run irrelevant. Main is exempt: those runs are the record of
# what happened on the branch that ships.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Read-only unless a job says otherwise. Without this every job gets the repository's default
# token, which on older repositories and organisations is write-all. Only `image` widens it.
#
# Every action is pinned by commit SHA, with the version it was at in a comment: a tag can be
# moved to other code by whoever controls the action's repository, and these steps run next
# to a token that can write packages. To move a pin, resolve the new tag to its commit
# (`git ls-remote --tags https://github.com/<owner>/<action>`) and update both.
permissions:
  contents: read

jobs:
  # The kit's own tests, not the fixture's. Pure functions only: everything that imports Dagger
  # is exercised by the stage jobs below, against a real project.
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm test

  analysis:
    name: Code analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The full history is needed to resolve the migration diff base against main.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - working-directory: fixtures/dotnet-api
        run: node ../../bin/shipkit ci --stage=pre --report=../../reports/analysis.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: report-analysis
          path: reports/analysis.json
          if-no-files-found: warn

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - working-directory: fixtures/dotnet-api
        run: node ../../bin/shipkit ci --stage=test --report=../../reports/tests.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: report-tests
          path: reports/tests.json
          if-no-files-found: warn

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - working-directory: fixtures/dotnet-api
        run: node ../../bin/shipkit ci --stage=db --report=../../reports/migrations.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: report-migrations
          path: reports/migrations.json
          if-no-files-found: warn

  # Last, and only if the checks passed: an image nothing vouched for has no reason to exist,
  # and on the default branch this job is what publishes.
  image:
    name: Image
    runs-on: ubuntu-latest
    needs: [analysis, tests, migrations]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - working-directory: fixtures/dotnet-api
        env:
          # Only a push has anything to publish; a pull request run is not handed the token at all.
          SHIPKIT_REGISTRY_TOKEN: ${{ github.event_name == 'push' && secrets.GITHUB_TOKEN || '' }}
        run: node ../../bin/shipkit ci --stage=build,push --report=../../reports/image.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: report-image
          path: reports/image.json
          if-no-files-found: warn

  # The same checks against the second stack. A kit with two adapters has two ways to break,
  # and the Next one must be as hard to break unnoticed as the .NET one
  # (docs/multi-stack-plan.md §7 step 4). The fixture is fixtures/next-app; its reports are
  # collected separately so that one table never describes two projects.
  #
  # No `fetch-depth: 0` in these three: the full history is for resolving the migration diff
  # base against main, and this fixture has no database and no migrations.
  analysis-next:
    name: Code analysis (next)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - working-directory: fixtures/next-app
        run: node ../../bin/shipkit ci --stage=pre --report=../../reports/next-analysis.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: next-report-analysis
          path: reports/next-analysis.json
          if-no-files-found: warn

  tests-next:
    name: Tests (next)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - working-directory: fixtures/next-app
        run: node ../../bin/shipkit ci --stage=test --report=../../reports/next-tests.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: next-report-tests
          path: reports/next-tests.json
          if-no-files-found: warn

  # `--stage=build,e2e` and not `--stage=e2e`: the stage serves the container `build` produced,
  # in memory, so the two have to be in one job. That means this job builds the image a second
  # time — the price of a browser suite that tests the artifact instead of the sources. A
  # project with no `e2e:` block skips the stage and pays only the build.
  e2e-next:
    name: End-to-end (next)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - working-directory: fixtures/next-app
        run: node ../../bin/shipkit ci --stage=build,e2e --report=../../reports/next-e2e.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: next-report-e2e
          path: reports/next-e2e.json
          if-no-files-found: warn

  # No `packages: write` and no registry token, unlike the .NET image job: this fixture is
  # `publish: false` and there is nothing for it to push. The push stage still runs, and is
  # still a decision it reports rather than a step that quietly did not happen.
  image-next:
    name: Image (next)
    runs-on: ubuntu-latest
    needs: [analysis-next, tests-next]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - working-directory: fixtures/next-app
        run: node ../../bin/shipkit ci --stage=build,push --report=../../reports/next-image.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: next-report-image
          path: reports/next-image.json
          if-no-files-found: warn

  summary:
    name: CI summary
    runs-on: ubuntu-latest
    needs: [unit, analysis, tests, migrations, image, analysis-next, tests-next, e2e-next, image-next]
    # The summary exists for the runs that failed. Skipping it when a job fails would remove it
    # from exactly the runs that need it.
    if: always()
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: report-*
          path: reports
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: next-report-*
          path: reports-next
      # One table per fixture. The summary merges the reports it is given by stage name, so a
      # single directory would put two projects' `pre` in one row and describe neither.
      #
      # The jobs' own results go in too, to both tables: `unit` writes no report, and neither
      # does a job that failed before the pipeline ran, and from reports alone the summary said
      # "ok" on a red run. The verdict is the run's, so a red job marks both tables.
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$NEEDS" > "$RUNNER_TEMP/needs.json"
          node bin/shipkit summary reports --title "CI — dotnet fixture" --jobs "$RUNNER_TEMP/needs.json" >> "$GITHUB_STEP_SUMMARY"
          node bin/shipkit summary reports-next --title "CI — next fixture" --jobs "$RUNNER_TEMP/needs.json" >> "$GITHUB_STEP_SUMMARY"
