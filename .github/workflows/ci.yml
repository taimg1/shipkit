# The kit's own CI: run the pipeline against the fixture on every push.
#
# ADR 0001 says this file is a checkout and one call. It is still true per job: every job below
# is a checkout and one `shipkit ci --stage=...`. What changed is how many jobs there are.
#
# One job used to run the whole pipeline, and the run page showed a single box that was either
# green or red. Which stage failed, how long each took, and what a gate actually said all lived
# in a log you had to open and scroll. One job per stage puts that on the graph, where it can be
# read without opening anything.
#
# The cost is real and worth stating: each job is a fresh runner with a cold Dagger cache, so
# the total machine time goes up. The three checks run in parallel, which buys most of the wall
# clock back.
#
# `build` and `push` share the built container in memory, so they stay in one job. That is what
# `--stage=build,push` exists for.
name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

# A newer push makes an in-flight run irrelevant. Main is exempt: those runs are the record of
# what happened on the branch that ships.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The kit's own tests, not the fixture's. Pure functions only: everything that imports Dagger
  # is exercised by the stage jobs below, against a real project.
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  analysis:
    name: Code analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The full history is needed to resolve the migration diff base against main.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - working-directory: fixtures/dotnet-api
        run: node ../../bin/shipkit ci --stage=pre --report=../../reports/analysis.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-analysis
          path: reports/analysis.json
          if-no-files-found: warn

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - working-directory: fixtures/dotnet-api
        run: node ../../bin/shipkit ci --stage=test --report=../../reports/tests.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-tests
          path: reports/tests.json
          if-no-files-found: warn

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - working-directory: fixtures/dotnet-api
        run: node ../../bin/shipkit ci --stage=db --report=../../reports/migrations.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-migrations
          path: reports/migrations.json
          if-no-files-found: warn

  # Last, and only if the checks passed: an image nothing vouched for has no reason to exist,
  # and on the default branch this job is what publishes.
  image:
    name: Image
    runs-on: ubuntu-latest
    needs: [analysis, tests, migrations]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - working-directory: fixtures/dotnet-api
        env:
          SHIPKIT_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node ../../bin/shipkit ci --stage=build,push --report=../../reports/image.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-image
          path: reports/image.json
          if-no-files-found: warn

  summary:
    name: CI summary
    runs-on: ubuntu-latest
    needs: [unit, analysis, tests, migrations, image]
    # The summary exists for the runs that failed. Skipping it when a job fails would remove it
    # from exactly the runs that need it.
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: report-*
          path: reports
      - run: node bin/shipkit summary reports >> "$GITHUB_STEP_SUMMARY"
