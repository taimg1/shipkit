# The no-database variant: copy this to .github/workflows/ci.yml in a client repository whose
# shipkit.yaml says `db: none` — a Next.js site, a worker, anything that owns no schema —
# together with templates/github/actions/setup/action.yml → .github/actions/setup/action.yml.
#
# It is `ci.yml` without the Migrations job and without its two `needs:` entries, and nothing
# else. A test in the kit (tests/client-workflow.test.ts) compares the two files line by line so
# the pair cannot drift; when you change one, change the other.
#
# Why a separate file rather than a note saying "delete the Migrations job": the deletion is
# three edits in three places, and the one that is easy to get wrong is silent. A `db: none`
# project that keeps the job gets a green "skipped: db=none" box on every run — a run that looks
# like it checked the migrations of a project that has none.
#
# Everything else about this workflow is ci.yml's, including why there is no deploy job and what
# a client changes per stack. Read the header there.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push makes an in-flight run irrelevant. The default branch is exempt: those runs are
# the record of what happened on the branch that ships, and their image is what a deploy releases.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Read-only unless a job says otherwise. Without this every job gets the repository's default
# token, which on older repositories and organisations is write-all. Only `image` widens it.
permissions:
  contents: read

jobs:
  analysis:
    name: Code analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The full history, in every job: on a pull request the wrapper reads the head commit
          # as `HEAD^2`, and a shallow clone does not have it. The build would then be tagged
          # with the merge commit, which is a SHA `/health` will never report.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: node "$SHIPKIT" ci --stage=pre --report=reports/analysis.json
      # The report, even from a job that failed — especially then: it is what the summary renders
      # the failed gate from.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-analysis
          path: reports/analysis.json
          if-no-files-found: warn

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: node "$SHIPKIT" ci --stage=test --report=reports/tests.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-tests
          path: reports/tests.json
          if-no-files-found: warn

  # Last, and only if the checks passed: an image nothing vouched for has no reason to exist,
  # and on the default branch this job is what publishes.
  image:
    name: Image
    runs-on: ubuntu-latest
    needs: [analysis, tests]
    permissions:
      contents: read
      # Needed because shipkit.yaml says `publish: true`: the push stage uploads the image with
      # this job's GITHUB_TOKEN, so no PAT is involved. It is on this job and no other — the
      # jobs above run the same code against the same commit and have nothing to publish.
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        # with:
        #   # Only when `targetArch` in shipkit.yaml is not the runner's (linux-x64).
        #   qemu: "true"
      - env:
          # Only a push has anything to publish; a pull request run is not handed the token at
          # all. It would not publish anyway — the module refuses any branch that is not the
          # default one — but a token that is never in the environment cannot leak from it.
          SHIPKIT_REGISTRY_TOKEN: ${{ github.event_name == 'push' && secrets.GITHUB_TOKEN || '' }}
        run: node "$SHIPKIT" ci --stage=build,push --report=reports/image.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-image
          path: reports/image.json
          if-no-files-found: warn

  summary:
    name: CI summary
    runs-on: ubuntu-latest
    needs: [analysis, tests, image]
    # The summary exists for the runs that failed. Skipping it when a job fails would remove it
    # from exactly the runs that need it.
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          # This job calls no stage, so it needs no engine — see the input's description.
          install-dagger: "false"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: report-*
          path: reports
      # The jobs' own results go in too. A job that failed before the pipeline ran wrote no
      # report, and from the reports alone the summary said "ok" on a red run.
      #
      # `summary` always exits 0 and this job stays green: the job that failed is what fails the
      # run, and a second red box here would only bury the reason under a rendering step.
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$NEEDS" > "$RUNNER_TEMP/needs.json"
          node "$SHIPKIT" summary reports --jobs "$RUNNER_TEMP/needs.json" >> "$GITHUB_STEP_SUMMARY"
