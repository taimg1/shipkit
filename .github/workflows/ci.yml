# The kit's own CI: run the pipeline against the fixture on every push.
#
# ADR 0001: this file is a checkout and one call. Everything it could be tempted to do —
# caching, matrix, conditionals, deciding what publishes — belongs in the Dagger module,
# where it also runs on a laptop.
name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The full history is needed to resolve the migration diff base against main.
          fetch-depth: 0

      # The fixture's targetArch is linux-arm64, because the server it deploys to is dev-server,
      # a container on an Apple Silicon Mac. Since #18 the image is built for the architecture it
      # is meant to run on rather than for whatever built it — and these runners are x86. Without
      # binfmt handlers the .NET SDK crashes inside the emulated build with NuGet errors that say
      # nothing about architecture.
      - uses: docker/setup-qemu-action@v3

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dagger
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh \
            | DAGGER_VERSION=v0.21.9 BIN_DIR=/usr/local/bin sh

      - name: Unit tests
        run: npm test

      - name: Pipeline against the fixture
        working-directory: fixtures/dotnet-api
        run: node ../../bin/shipkit ci
