# The fixture's own configuration. This is the file a client repo would carry, with one
# difference: no `kit:` line.
#
# A client repo pins a kit version and Dagger fetches that module. The fixture lives inside
# the kit and must always exercise the module it sits next to — pinning a released version
# here would mean the kit's own CI tested a previous release instead of the change under test.

service: shipkit-fixture
stack: dotnet
db: postgres
delivery: kamal

project: src/Api
migrationsProject: src/Infrastructure

dockerfile: Dockerfile
registry: ghcr.io/taimg1/shipkit-fixture

# The fixture exercises the pipeline; it is not a product and must never put an image in
# anyone's registry. Everything up to `push` still runs, so the stage is exercised as a
# decision rather than skipped by accident.
publish: false
health: /health

# Must match the SERVER's architecture, not the machine that builds the bundle. dev-server
# is aarch64; a linux-x64 bundle would fail on it mid-deploy, after the backup has run.
targetArch: linux-arm64

environments:
  prod:
    # dev-server, the simulated host. Everything here would be the real server's details.
    url: http://host.docker.internal:8080
    host: host.docker.internal
    sshPort: 2222
    sshUser: deploy
    # dev-server's fixed host key (dev-server/host-key/). A real server's comes from
    # server/bootstrap.sh's output — see docs/runbooks/server-bootstrap.md.
    hostKey: "[host.docker.internal]:2222 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINzSeby1W18fIv7pys7p0Pe4xiOEGK65dXpurYBTf5d1"
    database: app
    dbUser: postgres
