# Copy to the root of a client repo as `shipkit.yaml`.
# Missing file = the build fails with a message. There is no default — defaults hide
# misconfiguration.

# The kit version: a full 40-character commit of github.com/taimg1/shipkit, never a tag or a
# branch — those can be moved, and this line decides which code runs your pipeline and holds
# your deploy key. templates/github/ci.yml refuses anything else. `git ls-remote
# https://github.com/taimg1/shipkit <tag>` gives the commit a tag points to today.
kit: github.com/taimg1/shipkit@REPLACE_WITH_40_CHAR_COMMIT

# Must match `service:` in config/deploy.yml. Kamal refuses an image whose `service` label
# does not match, and it only labels images it built itself — so the kit labels ours.
service: client-api

stack: dotnet          # dotnet | next  (nest and custom have no adapter yet)
db: postgres           # postgres | none — "none" is required for a stack with no DB adapter
delivery: kamal        # kamal. `static` is planned (multi-stack-plan §7 step 5) and refused
                       # until it exists: a delivery model that loads but is not built would
                       # deploy through Kamal with one gate quietly switched off.

# What a stack requires of this file is the stack's own business
# (.dagger/src/adapters/requirements.ts), and what it does not require it refuses:
#
#   stack: dotnet   project (required), migrationsProject; stackVersion is a target framework
#                   ("10.0", quoted); no `lint` — `dotnet format` is the only linter.
#   stack: next     no project; stackVersion is the Node version ("22", quoted); db must be
#                   "none"; `lint` names the linter (see below).
#
# Both projects are required by `dotnet ef` and are never guessed: in most solutions the
# startup project and the migrations project are different.
project: src/Api
migrationsProject: src/Infrastructure

# The runtime version, quoted — YAML reads 10.0 as the number 10. Left out it is the stack's
# default (.NET 10.0, Node 22). `doctor` cross-checks the .NET one against the project file.
stackVersion: "10.0"

# The architecture the image is built for, and for .NET the one the migration bundle is
# compiled for. It must match the SERVER: an amd64 image does not run on an arm64 host, and
# the failure lands mid-deploy, after the backup.
targetArch: linux-x64

# Next only, and required there: which linter `pre` runs — eslint or biome. The adapter does
# not guess (docs/multi-stack-plan.md §6); a project linted by a tool it does not use goes
# green without being linted. `tsc --noEmit` runs either way.
# lint: eslint

dockerfile: Dockerfile
# The repository only — the kit appends :sha-<commit>. Lowercase, even when the GitHub
# organisation is not: a registry refuses a capital letter. It must name the same image as
# `registry.server` + `image:` in config/deploy.yml, which is what the server pulls
# (docs/runbooks/registry.md).
registry: ghcr.io/taimg1/client-api

# Only merges to this branch publish an image. A branch build that pushed would put
# unreviewed code in the registry under a tag indistinguishable from a released one — and
# rollback selects images by tag.
defaultBranch: main

# Set to false for a project that never publishes an image (a fixture, a library).
# true needs `packages: write` and SHIPKIT_REGISTRY_TOKEN in the ci workflow — both are in
# templates/github/ci.yml; with false, delete them there.
# Extra build arguments, for a stack that needs configuration while the image is built —
# Next inlines NEXT_PUBLIC_* into the browser bundle during `next build`, so they cannot be
# supplied at run time. Written here rather than in the workflow because the image tag is the
# commit: one commit must mean one image. Public by construction; secrets never go here.
# buildArgs:
#   NEXT_PUBLIC_SITE_URL: https://example.com

publish: true

# /health must return {"status":"ok","version":"<sha>"}.
# `verify` checks the SHA, not just the status code — a 200 from the previous container is
# a failed deploy that looks green.
health: /health

# How many verified pre-deploy dumps to keep on the server, in
# /var/backups/shipkit/<service>/. Older ones are deleted after each new one is stored.
# A positive integer; anything else is a config error.
backupRetention: 10

# Set on the connection the migration bundle opens (PGOPTIONS). They are why Squawk's
# require-lock-timeout / require-statement-timeout rules can stay excluded. A PostgreSQL
# duration with a unit; 0 (no timeout) is refused. These are the defaults.
migrations:
  lockTimeout: 5s
  statementTimeout: 15min

# Required unless db is "none": an endpoint that answers 200 only when the application can
# reach its database. /health deliberately touches nothing, so on its own it passes a release
# with a wrong connection string. verify requires both after every release and every rollback.
ready: /health/ready

# How long verify keeps retrying — unreachable, the previous version still answering, or not
# ready yet — before the release is declared failed and rolled back. Seconds, 1–600.
verifyTimeout: 60

environments:
  prod:
    url: https://api.client.com
    # Once the server exists. These values are used in shell commands, so each one is checked
    # for shape when shipkit.yaml is loaded: a hostname or IP, a login name, a port from 1 to
    # 65535, plain Docker/PostgreSQL names. Anything else is a config error, not a guess.
    # host and hostKey are added together: a host without its hostKey is a config error, since
    # every SSH connection verifies the server against this line and refuses anything else.
    # host: api.client.com
    # sshUser: deploy
    # sshPort: 22
    # hostKey: "api.client.com ssh-ed25519 AAAA..."   # from server/bootstrap.sh's output
    # database: app
    # dbUser: postgres
