# Copy to .github/workflows/ci.yml in a client repository, together with
# templates/github/actions/setup/action.yml → .github/actions/setup/action.yml, which every job
# below uses. A project with no database (`db: none` in shipkit.yaml) copies `ci-no-db.yml`
# instead: the same file without the Migrations job.
#
# ADR 0001 says this file is a checkout and one call. It is still true per job: every job below
# is a checkout, the setup action and one call to the wrapper — `shipkit ci --stage=...` for the
# checks, `shipkit deploy --auto` for the deploy (amendment, 2026-09-17). The only other shell
# in this file writes the deploy key to a file and hands the wrapper's own JSON to the GitHub
# API; neither of those decides anything about the pipeline.
#
# One job used to run the whole pipeline, and the run page showed a single box that was either
# green or red. Which stage failed, how long each took, and what a gate actually said all lived
# in a log you had to open and scroll. One job per stage puts that on the graph. Nothing moved
# into YAML: which stages exist, what they do and whether they passed are all still the module's.
#
# The cost is real and worth stating: each job is a fresh runner with a cold Dagger cache, so
# the total machine time goes up. The three checks run in parallel, which buys most of the wall
# clock back.
#
# `build` and `push` share the built container in memory, so they stay in one job. Split across
# runners, `push` finds no image and skips itself — a green run that published nothing. That is
# what `--stage=build,push` exists for.
#
# The last job deploys. A push to the default branch releases its own image, unattended, when
# the module may approve the plan itself; anything a person would want to look at stops with
# exit 4 and hands the plan back. It is the only job that sees the deploy key, and the only one
# that writes anything outside this repository. Before enabling it, read "Before you turn the
# deploy job on" in docs/runbooks/deploy.md: the secrets it needs, the SSH route from the
# runner to the server, and why the first deploy through the kit should still be run by hand.
#
# What changes per stack: nothing in this file. Every job is `shipkit ci --stage=...`, and what
# a stage does comes from shipkit.yaml — `stack:` picks the adapter that owns the lint command,
# the Dockerfile and the test runner; `db: none` means there is no Migrations job at all (use
# ci-no-db.yml); `publish: false` means the Image job needs neither `packages: write` nor
# SHIPKIT_REGISTRY_TOKEN, so delete both; `targetArch:` other than the runner's needs `qemu:`
# on the setup step of the Image job. The commands themselves are never written here.
#
# Every action is pinned by commit SHA, with the version it was at in a comment: a tag can be
# moved to other code by whoever controls the action's repository, and these steps run next to a
# token that can write packages. The versions are the first majors whose `action.yml` declares
# `using: node24`, or later — the runner warns on, and eventually stops running, node20 actions.
# To move a pin, resolve the new tag to its commit
# (`git ls-remote --tags https://github.com/<owner>/<action>`), read the `runs.using:` in that
# action's action.yml at that commit, and update the SHA and the comment together.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push makes an in-flight run irrelevant. The default branch is exempt: those runs are
# the record of what happened on the branch that ships, and their image is what a deploy releases.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Read-only unless a job says otherwise. Without this every job gets the repository's default
# token, which on older repositories and organisations is write-all. Only `image` widens it.
permissions:
  contents: read

jobs:
  analysis:
    name: Code analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The full history, in every job: the migration diff base is the merge base with the
          # default branch, and on a pull request the wrapper reads the head commit as `HEAD^2`.
          # A shallow clone has neither, and the stage that needs one fails on the runner only.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: node "$SHIPKIT" ci --stage=pre --report=reports/analysis.json
      # The report, even from a job that failed — especially then: it is what the summary renders
      # the failed gate from.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-analysis
          path: reports/analysis.json
          if-no-files-found: warn

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: node "$SHIPKIT" ci --stage=test --report=reports/tests.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-tests
          path: reports/tests.json
          if-no-files-found: warn

  # The browser suite, against the image this run built. Delete this job on a project with no
  # `e2e:` block in shipkit.yaml: the stage would skip with "not configured", and the build
  # below would have run for nothing.
  #
  # `--stage=build,e2e` and not `--stage=e2e`: the stage serves the container `build` produced,
  # in memory, so the two have to be in one job. The image is therefore built twice per run —
  # the price of testing the artifact that would be deployed instead of the sources it came
  # from. Dagger caches the build, so the second one is usually a cache hit on the same runner
  # and a rebuild across runners.
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: node "$SHIPKIT" ci --stage=build,e2e --report=reports/e2e.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-e2e
          path: reports/e2e.json
          if-no-files-found: warn

  # Squawk on the pending SQL, then the migrations applied to a seeded copy of the schema and
  # the rows counted. Delete this job on a project with `db: none` — or rather, copy ci-no-db.yml,
  # which is this file with the job and its two `needs:` entries already gone.
  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: node "$SHIPKIT" ci --stage=db --report=reports/migrations.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-migrations
          path: reports/migrations.json
          if-no-files-found: warn

  # Last, and only if the checks passed: an image nothing vouched for has no reason to exist,
  # and on the default branch this job is what publishes.
  image:
    name: Image
    runs-on: ubuntu-latest
    needs: [analysis, tests, e2e, migrations]
    permissions:
      contents: read
      # Needed because shipkit.yaml says `publish: true`: the push stage uploads the image with
      # this job's GITHUB_TOKEN, so no PAT is involved. It is on this job and no other — the
      # three jobs above run the same code against the same commit and have nothing to publish.
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        # with:
        #   # Only when `targetArch` in shipkit.yaml is not the runner's (linux-x64).
        #   qemu: "true"
      - env:
          # Only a push has anything to publish; a pull request run is not handed the token at
          # all. It would not publish anyway — the module refuses any branch that is not the
          # default one — but a token that is never in the environment cannot leak from it.
          SHIPKIT_REGISTRY_TOKEN: ${{ github.event_name == 'push' && secrets.GITHUB_TOKEN || '' }}
        run: node "$SHIPKIT" ci --stage=build,push --report=reports/image.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-image
          path: reports/image.json
          if-no-files-found: warn

  # A merge to the default branch deploys itself, when the plan is one the module may approve on
  # its own: no destructive SQL, no declared data loss, nothing to provision, and the image for
  # this commit published. `--auto` decides nothing — it only says that nobody is waiting at a
  # terminal; core/auto-approve.ts in the module is what judges the plan.
  #
  # Anything else stops with exit 4: nothing on the server is touched, and this job goes red.
  # That is deliberate, and it is the one decision in this file worth arguing about. Exit 4 is
  # not a failure of the pipeline — the job summary says "stopped", not "failed", and the
  # deployment below is recorded as `inactive`, never `success`. But GitHub Actions cannot give
  # a job a neutral conclusion: the only way to get one is to publish a second check run beside
  # this one, saying something different about the same work. A green box is worse — a merge
  # that did not reach production must not look like one that did, and green is what people
  # stop reading. So: red, with every surface saying what actually happened, and the plan plus
  # the exact `shipkit deploy --yes=<token>` command in this job's summary.
  deploy:
    name: Deploy
    # The Image job, which already needs the checks. Not "ci passed somewhere": this commit's
    # own image, from this run — anything else is a different commit as soon as two merges land
    # close together. `e2e` is named as well, although Image already waits for it: a deploy
    # that stopped waiting for the browser suite because someone edited a different job's
    # `needs:` is exactly the kind of quiet loss this file exists to prevent.
    needs: [image, e2e]
    # Only a push, only to the branch that publishes. A tag never reaches here — `on:` filters
    # it, and a tag's ref_name is not a branch name either — and a pull request never does.
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    # One deploy at a time. Two merges landing a minute apart would otherwise migrate the same
    # database from two runners at once; the module's server-side lock refuses the second, and
    # this keeps it from ever being started. cancel-in-progress is false on purpose and must
    # stay false: a deploy cancelled between `migrate` and `verify` leaves production on a
    # schema nothing has verified, which is the one state this pipeline exists to avoid. The
    # group is per repository and environment — add the service name if this repository ever
    # deploys more than one.
    concurrency:
      group: shipkit-deploy-${{ github.repository }}-prod
      cancel-in-progress: false
    permissions:
      contents: read
      # Reading the image ci published, not writing one. `packages: read` is enough for
      # ghcr.io; another registry needs its own read-only credential in SHIPKIT_REGISTRY_TOKEN
      # below, and then this line can go.
      packages: read
      # The deployment record the last step writes. It is the only right this job has that the
      # others do not, and it grants nothing over the code.
      deployments: write
      # No `id-token: write`. Nothing here exchanges an OIDC token: the server is reached with
      # the SSH key below and the registry with this job's GITHUB_TOKEN. Add it only if your
      # registry or cloud is configured for OIDC, and add it only then — an unused token that
      # can assume a cloud role is a credential lying around.
    steps:
      # Default depth: a deploy needs this commit's tree and its SHA, not its history. The
      # migration diff base is the checks' business, and they have their own checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      # The private half of the key whose public half is in the deploy user's authorized_keys
      # on the server. A repository secret, never a file in the repository. The file is created
      # empty with mode 600 and only then written, so the key never exists world-readable for
      # even an instant; $RUNNER_TEMP is wiped with the runner.
      - name: Write the deploy key
        env:
          SHIPKIT_SSH_KEY: ${{ secrets.SHIPKIT_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SHIPKIT_SSH_KEY" || { echo "the repository secret SHIPKIT_SSH_KEY is empty: no key to reach the server with"; exit 2; }
          install -m 600 /dev/null "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$SHIPKIT_SSH_KEY" > "$RUNNER_TEMP/deploy_key"

      - name: shipkit deploy --auto
        env:
          # The deploy key written above. The kit reads it engine-side as a Dagger secret; it is
          # never an argument, so it cannot appear in a process listing or in the run log.
          SHIPKIT_SSH_KEY: ${{ runner.temp }}/deploy_key
          # Pulling the image onto the server. GITHUB_TOKEN covers ghcr.io for this
          # repository's own packages (with `packages: read` above); for any other registry, or
          # an image owned by another organisation, put a read-only token in a secret of your
          # own and use it here instead.
          SHIPKIT_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The production connection string the migration bundle opens. Only the `migrate`
          # stage uses it, and only when something is actually pending: a release with nothing
          # to apply never opens that connection and never asks for the secret. Set it anyway —
          # the day a migration merges is not the day to discover it is missing — but a project
          # that has no migrations yet is not blocked by an empty one.
          SHIPKIT_DATABASE_URL: ${{ secrets.SHIPKIT_DATABASE_URL }}
          # Everything `.kamal/secrets` refers to. That file holds NAME=$NAME references, not
          # values, and the kit resolves them here, where the environment is — a reference with
          # nothing behind it stops the deploy before the server is touched (#19), naming every
          # variable it could not resolve. So every name in your .kamal/secrets needs a line
          # here. The three commented out below are the names the kit's own example file uses;
          # yours are whatever your file names, so uncomment and rename them. The deploy does
          # not start until every one of them resolves. KAMAL_REGISTRY_PASSWORD is not among
          # them: the kit injects it from SHIPKIT_REGISTRY_TOKEN.
          # POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          # APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}
          # APP_DATABASE_URL: ${{ secrets.APP_DATABASE_URL }}
        # Exit 0 deployed and verified; exit 4 stopped and changed nothing; anything else is a
        # gate, the configuration or the infrastructure. Everything but 0 fails this job.
        run: node "$SHIPKIT" deploy --auto --report=reports/deploy.json

      # The three steps below run even when the deploy failed or stopped — especially then. The
      # report is what says which stage ran, where the pre-deploy dump is kept, which version is
      # serving, whether a rollback fired, and, when it stopped, the plan and the token.
      - name: Deploy summary
        # Unless the kit itself was never fetched — there is nothing to render with, and the
        # step that failed has already said why.
        if: always() && env.SHIPKIT != ''
        run: node "$SHIPKIT" summary reports --title Deploy >> "$GITHUB_STEP_SUMMARY"

      # What went to production, recorded where GitHub shows it. The state comes from the report
      # the deploy wrote and from nothing else: a deployment marked `success` while `verify`
      # failed and the release was rolled back is worse than no record at all. The mapping is in
      # the wrapper (bin/deployment.mjs, ADR 0009) and unit-tested there; these three lines only
      # hand its two bodies to the API, and the module stays unaware that GitHub exists.
      #
      # This job deliberately does not use Actions' own `environment:` key: that creates a
      # deployment whose status follows the job's outcome, which is exactly what must not decide
      # it. A failure here fails the job even when the deploy succeeded — a deploy nobody wrote
      # down is a gap in the record people consult during an incident, and it should be loud.
      - name: Record the deployment
        if: always() && env.SHIPKIT != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node "$SHIPKIT" summary reports --deployment-status "$RUNNER_TEMP/deployment"
          id=$(gh api "repos/$GITHUB_REPOSITORY/deployments" --input "$RUNNER_TEMP/deployment/deployment.json" --jq .id)
          gh api --silent "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" --input "$RUNNER_TEMP/deployment/status.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-deploy
          path: reports/deploy.json
          if-no-files-found: warn

  summary:
    name: CI summary
    runs-on: ubuntu-latest
    # The check jobs, not `deploy`. This summary is about whether the commit is fit to release,
    # and it should be readable the moment those jobs are done rather than held behind a deploy
    # that takes minutes. The deploy renders its own summary, in its own job, from its own
    # report — and a deploy report merged into this table would be a second pipeline's stages
    # in a table titled CI.
    needs: [analysis, tests, e2e, migrations, image]
    # The summary exists for the runs that failed. Skipping it when a job fails would remove it
    # from exactly the runs that need it.
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          # This job calls no stage, so it needs no engine — see the input's description.
          install-dagger: "false"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: report-*
          path: reports
      # The jobs' own results go in too. A job that failed before the pipeline ran wrote no
      # report, and from the reports alone the summary said "ok" on a red run.
      #
      # `summary` always exits 0 and this job stays green: the job that failed is what fails the
      # run, and a second red box here would only bury the reason under a rendering step.
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$NEEDS" > "$RUNNER_TEMP/needs.json"
          node "$SHIPKIT" summary reports --jobs "$RUNNER_TEMP/needs.json" >> "$GITHUB_STEP_SUMMARY"
